# csm-managed-workflow-version: 2026100901
name: River Atlas - Integration
run-name: River Atlas - Integration · ${{ inputs.run_tag || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      run_tag:
        description: Opaque runtime correlation key
        required: false
        default: manual
        type: string
      backup_prefix:
        description: Isolated Actions Cache namespace for this instance generation
        required: false
        default: ''
        type: string
      mode:
        description: Start fresh or restore the latest managed user-data backup
        required: true
        default: new
        type: choice
        options:
          - new
          - restore
      machine_id:
        description: Logical machine ID
        required: true
        default: '001'
        type: string
      machine_name:
        description: Friendly machine name
        required: false
        default: 'UBUNTU-001'
        type: string
      runner_image:
        description: Ubuntu GitHub-hosted runner image selected from the live actions/runner-images catalog
        required: true
        default: ubuntu-24.04
        type: string
      desktop_username:
        description: Ubuntu local account used for SSH
        required: true
        default: admin
        type: string
      bootstrap_ticket:
        description: Cloudflare bootstrap ticket
        required: true
        type: string
      web_url:
        description: Current Web URL
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: managed-ubuntu-${{ inputs.machine_id || '001' }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ${{ inputs.runner_image }}
    timeout-minutes: 360
    env:
      MACHINE_ID: ${{ inputs.machine_id || '001' }}
      BACKUP_CACHE_PREFIX: ${{ inputs.backup_prefix || format('managed-desktop-ubuntu-{0}-', inputs.machine_id) }}
      MACHINE_NAME: ${{ inputs.machine_name || 'UBUNTU-001' }}
      DESKTOP_USERNAME: ${{ inputs.desktop_username || 'admin' }}
      RUNNER_IMAGE: ${{ inputs.runner_image }}
      MACHINE_MODE: ${{ inputs.mode || 'new' }}
      WEB_URL: ${{ inputs.web_url }}
